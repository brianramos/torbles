# Every push and pull request: build the engine, run every correctness test (the GPU kernels run in their CPU
# emulation), fuzz against DuckDB, and check that the package installs from its sdist and wheel.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: dependencies
        run: python -m pip install --upgrade pip numpy duckdb pandas pyarrow
      - name: build the engine
        run: make
      - name: every correctness test
        run: make test
      - name: differential fuzzing against DuckDB (5 minutes)
        run: python -m torbles.fuzz --minutes 5 --keep-going
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sdist and a portable wheel
        run: |
          python -m pip install --upgrade pip build
          TORBLES_PORTABLE=1 python -m build
      - name: install the wheel in a clean environment and use it
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl pandas
          cd /tmp && /tmp/v/bin/python -c "import torbles; print(torbles.__version__, torbles.mm_kernel())"
          /tmp/v/bin/torbles-fuzz --seed 1 --cases 20
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
