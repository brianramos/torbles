[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torbles"
dynamic = ["version"]
description = "An algebraic relational datastore on torus-encoded bit planes: filters as Boolean polynomials, sums as popcounts, joins as substitutions"
readme = "README.md"
requires-python = ">=3.11"     # DuckDB 2.0 (below) publishes wheels for CPython 3.11 and later only
license = {text = "Apache-2.0"}
authors = [{name = "Brian Richard RAMOS"}]
keywords = ["database", "olap", "bit planes", "popcount", "gpu", "cuda", "star schema", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
]
# The floors are the lowest versions tests/check_min_deps.py and tests/check_sql.py pass with, installed from the wheel
# (the min-deps job of .github/workflows/ci.yml); torbles.sqlfront.DUCKDB_FLOOR enforces DuckDB's at the first SQL use.
dependencies = [
    "numpy>=1.23.2",   # the first NumPy with CPython 3.11 wheels; 1.22 cannot build object arrays with np.fromiter (sqlwin)
    "duckdb>=2.0",     # the SQL binder reads DuckDB 2.0's syntax tree; 1.1 to 1.5 serialize another (SELECT 1 failed)
]

[project.optional-dependencies]
frames = ["pandas>=1.5", "pyarrow>=10"]
test = ["pandas>=1.5", "pyarrow>=10", "pytz", "pyuca>=1.2"]   # pytz: DuckDB returns TIMESTAMP WITH TIME ZONE values through it
unicode = ["pyuca>=1.2"]                                        # COLLATE UNICODE: the Unicode Collation Algorithm

[project.urls]
Homepage = "https://github.com/brianramos/torbles"
Source = "https://github.com/brianramos/torbles"
Issues = "https://github.com/brianramos/torbles/issues"

[project.scripts]
torbles-fuzz = "torbles.fuzz:main"
torbles-sqlfuzz = "torbles.sqlfuzz:main"

[tool.setuptools]
packages = ["torbles"]
include-package-data = true

[tool.setuptools.package-data]
torbles = ["*.so", "*.h", "*.c", "*.cu", "*.cuh"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
